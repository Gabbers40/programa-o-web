<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Exercício 03 – Menções</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://tse3.mm.bing.net/th/id/OIP.qirmcuwmkP0rvWABdDiPmQHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3');
            background-color: #2c3e50; 
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(4px);
        }
        
        .exibicao{
            margin: 20px 0;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            background: #fafafa;
        }

        #animal-img{
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ddd;
            transition: 0.3s;
        }

        #personagem-nome{
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 12px;
        }

        .botoes{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .botoes button {
            background: #3498db;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 0 auto;
            min-width: 80px;
            box-shadow: 0 2px 6px rgba(52,152,219,0.3);
        }

        h1 {
            color: #1e2b3a;
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 10px;
        }



        .erro {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Escolha seu Cachorro/Gato</h1>
        <div class="exibicao">
            <img id="personagem-img" src=""

        </div>        
</div>
</body>
</html>
